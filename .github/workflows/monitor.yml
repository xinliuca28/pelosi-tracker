name: Congressional Disclosure Auto-Monitor

on:
  schedule:
    # 每天 UTC 12:00 和 22:00 自动触发检查
    - cron: '0 12,22 * * *'
  workflow_dispatch: # 支持在 GitHub 界面手动点击运行

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pandas

      - name: Run Member Monitor Script
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python check_updates.py
