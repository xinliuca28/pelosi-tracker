name: Sync Separate Trackers Data

on:
  schedule:
    # 每天 UTC 时间早上 8 点自动运行 (可按需修改)
    - cron: '0 8 * * *'
  # 允许在 GitHub Actions 页面手动点击按钮触发
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Congress 5-Year Fetcher
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python fetch_congress.py

      - name: Run Buffett 13F Fetcher
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python fetch_buffett.py

      - name: Commit and push data changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # 如果 data 目录下有文件变化，则提交并推送到仓库
          git diff --staged --quiet || git commit -m "chore: auto-update tracker data via API"
          git push
