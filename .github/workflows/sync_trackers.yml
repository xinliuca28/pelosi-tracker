name: Sync Separate Trackers Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4  # 升级至 v4，消除 Node.js 警告

      - name: Set up Python
        uses: actions/setup-python@v5  # 升级至 v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Congress 5-Year Fetcher
        run: python fetch_congress.py

      - name: Run Buffett 13F Fetcher
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}  # 确保传入 API Key
        run: python fetch_buffett.py

      - name: Commit and push data changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: auto-update tracker data via API"
          git push
